<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой первый вайбкодинг</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      background-color: #6c63ff;
      transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    body::before { width:500px;height:500px;top:-120px;left:-120px;background:rgba(255,255,255,0.3); }
    body::after  { width:400px;height:400px;bottom:-100px;right:-100px;background:rgba(0,0,0,0.2); }

    .heading {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      color: #fff;
      text-align: center;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-shadow: 0 4px 32px rgba(0,0,0,0.18);
      padding: 0 24px;
      position: relative;
      z-index: 1;
      user-select: none;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .heading.pop { transform: scale(1.08); }

    .btn {
      position: relative;
      z-index: 1;
      padding: 18px 48px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 100px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      outline: none;
      overflow: hidden;
    }
    .btn:hover { background:rgba(255,255,255,0.28); border-color:rgba(255,255,255,0.85); transform:translateY(-3px) scale(1.03); box-shadow:0 16px 48px rgba(0,0,0,0.22); }
    .btn:active { transform:translateY(1px) scale(0.98); }

    .btn-snake { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.3); font-size:1rem; padding:14px 36px; }
    .btn-snake:hover { background:rgba(255,255,255,0.18); }

    .btn .ripple {
      position: absolute; border-radius: 50%;
      width: 10px; height: 10px;
      background: rgba(255,255,255,0.55);
      transform: scale(0);
      animation: ripple-anim 0.55s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform:scale(30); opacity:0; } }

    .counter {
      position: fixed; bottom:28px; right:32px;
      font-size: 0.85rem; font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.06em; text-transform: uppercase;
      z-index: 1;
    }

    .emoji-burst {
      position: fixed;
      font-size: 2.8rem;
      pointer-events: none;
      z-index: 999;
      animation: emoji-float 3s ease-out forwards;
      transform: translate(-50%,-50%);
      user-select: none;
    }
    @keyframes emoji-float {
      0%   { opacity:1; transform:translate(-50%,-50%) scale(0.4); }
      15%  { opacity:1; transform:translate(-50%,-80%) scale(1.2); }
      40%  { opacity:0.9; transform:translate(-50%,-110%) scale(1); }
      100% { opacity:0; transform:translate(-50%,-180%) scale(0.7); }
    }

    /* ── Snake overlay ─────────────────────────────────────── */
    #snake-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      z-index: 500;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #snake-overlay.open { display: flex; }

    #snake-overlay::before {
      content: '';
      position: fixed;
      width:600px;height:600px;top:-200px;left:-200px;
      border-radius:50%;
      background:radial-gradient(circle,#6c63ff33,transparent 70%);
      pointer-events:none;
    }
    #snake-overlay::after {
      content: '';
      position: fixed;
      width:500px;height:500px;bottom:-150px;right:-150px;
      border-radius:50%;
      background:radial-gradient(circle,#ff658433,transparent 70%);
      pointer-events:none;
    }

    #snake-overlay h1 {
      font-size: clamp(1.8rem,5vw,3rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.03em;
      text-shadow: 0 0 40px rgba(108,99,255,0.8);
      position: relative;
      z-index: 1;
    }

    .snake-hud {
      display: flex;
      gap: 32px;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    .snake-hud span { color: #fff; }

    .sn-progress-wrap {
      position: relative;
      z-index: 1;
      width: min(528px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sn-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .sn-progress-label .sn-pct {
      color: #fff;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }
    .sn-progress-track {
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: visible;
      position: relative;
    }
    .sn-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 100px;
      background: linear-gradient(90deg, #6c63ff, #a29bfe, #ff6584);
      background-size: 200% 100%;
      box-shadow: 0 0 14px rgba(108,99,255,0.7);
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s;
      animation: progress-shimmer 2.5s linear infinite;
      position: relative;
    }
    @keyframes progress-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sn-progress-fill.full {
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      box-shadow: 0 0 24px rgba(67,233,123,0.85);
    }
    .sn-progress-fill::after {
      content: '';
      position: absolute;
      right: -1px; top: -3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 24px rgba(108,99,255,0.8);
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .sn-progress-fill.active::after { transform: scale(1); }

    #snake-canvas {
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 60px rgba(108,99,255,0.35), 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
      z-index: 1;
      cursor: crosshair;
      display: block;
    }

    .snake-hint {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }

    #snake-overlay .close-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.4rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #snake-overlay .close-btn:hover { background: rgba(255,255,255,0.25); }

    #sn-modal {
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 600;
    }
    #sn-modal h2 {
      font-size: clamp(2rem,6vw,4rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.03em;
      text-align: center;
    }
    #sn-modal p { font-size:1.1rem; color:rgba(255,255,255,0.6); text-align:center; }
    #sn-modal .sn-score-big { font-size:3rem; font-weight:900; color:#6c63ff; text-shadow:0 0 30px #6c63ff; display:none; }

    .play-btn {
      padding: 16px 44px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: #6c63ff;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(108,99,255,0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .play-btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 16px 48px rgba(108,99,255,0.65); }
    .play-btn:active { transform:scale(0.97); }
    .play-btn-ghost { background:transparent; box-shadow:none; border:2px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.7); font-size:0.95rem; }
    .play-btn-ghost:hover { background:rgba(255,255,255,0.08); box-shadow:none; color:#fff; border-color:rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <h1 class="heading" id="heading">Мой первый&nbsp;вайбкодинг</h1>

  <button class="btn" id="colorBtn" onclick="handleClick(event)">
    Сменить цвет ✨
  </button>

  <button class="btn btn-snake" onclick="openSnake()">
    🐍 Мини-игра: Змейка
  </button>

  <span class="counter" id="counter">0 нажатий</span>

  <!-- ── Snake overlay ──────────────────────────────────────── -->
  <div id="snake-overlay">
    <button class="close-btn" onclick="closeSnake()" title="Закрыть">✕</button>
    <h1>🐍 Змейка</h1>
    <div class="snake-hud">
      Счёт: <span id="sn-score">0</span> &nbsp;|&nbsp; Рекорд: <span id="sn-best">0</span>
    </div>
    <div class="sn-progress-wrap">
      <div class="sn-progress-label">
        <span>Заполнение поля</span>
        <span class="sn-pct" id="sn-pct">0%</span>
      </div>
      <div class="sn-progress-track">
        <div class="sn-progress-fill" id="sn-progress-fill"></div>
      </div>
    </div>
    <canvas id="snake-canvas"></canvas>
    <p class="snake-hint">WASD / ↑↓←→ — клавиатура &nbsp;·&nbsp; Мышь — наводить курсор на сторону</p>

    <div id="sn-modal">
      <h2 id="sn-title">🐍 Змейка</h2>
      <p id="sn-sub">Нажмите кнопку или пробел, чтобы начать</p>
      <div class="sn-score-big" id="sn-score-big"></div>
      <button class="play-btn" id="sn-btn" onclick="snakeStart()">Играть</button>
      <button class="play-btn play-btn-ghost" id="sn-menu-btn" onclick="closeSnake()" style="display:none">← Вернуться в меню</button>
    </div>
  </div>

  <script>
    /* ══════════════════════════════════════════
       MAIN PAGE
    ══════════════════════════════════════════ */
    const PALETTE = [
      "#6c63ff","#ff6584","#43b89c","#f7971e","#ff5f6d",
      "#4facfe","#43e97b","#fa709a","#a18cd1","#fd7043",
      "#00b4d8","#e040fb","#ff6e40","#26c6da","#7c4dff",
      "#69f0ae","#ff4081","#40c4ff","#b2ff59","#ff6d00",
      "#ea4c89","#3b82f6","#10b981","#f59e0b","#ef4444",
    ];
    const EMOJIS = [
      "🎉","🔥","✨","💥","🌈","🦄","🎊","💫","🍀","🎯",
      "🚀","⚡","🌟","💎","🎸","🐉","🦋","🎆","🍭","🤩",
      "😎","🥳","💃","🎵","🌺","🏆","🦁","🍕","🎨","🌊",
    ];

    let lastIdx = 0, pressCount = 0, audioCtx = null;

    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playPop() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(820, ctx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    function spawnEmoji(x, y) {
      const el = document.createElement('span');
      el.className = 'emoji-burst';
      el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function handleClick(e) {
      let idx;
      do { idx = Math.floor(Math.random() * PALETTE.length); } while (idx === lastIdx);
      lastIdx = idx;
      document.body.style.backgroundColor = PALETTE[idx];

      const btn = document.getElementById('colorBtn');
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left - 5) + 'px';
      ripple.style.top  = (e.clientY - rect.top  - 5) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());

      playPop();

      spawnEmoji(
        Math.random() * (window.innerWidth  - 60) + 30,
        Math.random() * (window.innerHeight - 60) + 30
      );

      pressCount++;
      const counter = document.getElementById('counter');
      const word = pressCount === 1 ? 'нажатие' : (pressCount < 5 ? 'нажатия' : 'нажатий');
      counter.textContent = pressCount + ' ' + word;

      const heading = document.getElementById('heading');
      if (pressCount === 10) {
        heading.textContent = 'я действительно крут';
        heading.classList.add('pop');
        setTimeout(() => heading.classList.remove('pop'), 400);
        for (let i = 0; i < 8; i++) {
          setTimeout(() => spawnEmoji(Math.random() * window.innerWidth, Math.random() * window.innerHeight), i * 80);
        }
      }
    }

    /* ══════════════════════════════════════════
       SNAKE GAME
    ══════════════════════════════════════════ */
    const CELL = 22, COLS = 24, ROWS = 20;
    const SN_TOTAL = COLS * ROWS; // 480 cells = 100%
    let snakeCanvas, snakeCtx;
    let snake, snDir, snDirQueue, snFood, snScore, snGrowth = 0;
    let snBest = 0, snRunning = false, snRaf, snSpeed, snLastTime = 0, snAcc = 0;
    // Cached DOM refs (set in openSnake to avoid per-frame getElementById)
    let elScore, elBest, elPct, elFill;

    const SK = '#6c63ff', SH = '#a29bfe', FC = '#ff6584', FC_BONUS = '#ffd700', GC = 'rgba(255,255,255,0.03)', BG = '#16213e';
    // KEY_MAP uses e.key for arrow keys; CODE_MAP uses e.code for WASD (layout-independent)
    const KEY_MAP  = {ArrowUp:'U', ArrowDown:'D', ArrowLeft:'L', ArrowRight:'R'};
    const CODE_MAP = {KeyW:'U', KeyS:'D', KeyA:'L', KeyD:'R'};
    const OPP = {U:'D', D:'U', L:'R', R:'L'};

    function openSnake() {
      const overlay = document.getElementById('snake-overlay');
      overlay.classList.add('open');

      if (!snakeCanvas) {
        snakeCanvas = document.getElementById('snake-canvas');
        snakeCtx = snakeCanvas.getContext('2d');
        snakeCanvas.width  = COLS * CELL;
        snakeCanvas.height = ROWS * CELL;
        // Cache DOM refs once
        elScore = document.getElementById('sn-score');
        elBest  = document.getElementById('sn-best');
        elPct   = document.getElementById('sn-pct');
        elFill  = document.getElementById('sn-progress-fill');

        try { snBest = +localStorage.getItem('snake_best') || 0; } catch(e) {}
        elBest.textContent = snBest;

        snakeCanvas.addEventListener('click', function() {
          if (!snRunning) snakeStart();
        });

        snakeDraw();
      }

      var modal = document.getElementById('sn-modal');
      modal.style.display = 'flex';
      document.getElementById('sn-title').textContent = '🐍 Змейка';
      document.getElementById('sn-sub').textContent = 'WASD / ↑↓←→ — управление';
      document.getElementById('sn-score-big').style.display = 'none';
      var btn = document.getElementById('sn-btn');
      btn.textContent = 'Играть'; btn.style.display = '';
      document.getElementById('sn-menu-btn').style.display = 'none';
    }

    function closeSnake() {
      document.getElementById('snake-overlay').classList.remove('open');
      snRunning = false;
      if (snRaf) cancelAnimationFrame(snRaf);
    }

    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('snake-overlay').classList.contains('open')) return;
      if (e.key === 'Escape') { closeSnake(); return; }
      if (e.key === ' ' && !snRunning) { snakeStart(); e.preventDefault(); return; }
      var d = KEY_MAP[e.key] || CODE_MAP[e.code];
      if (!d) return;
      e.preventDefault();
      // Direction queue: compare against last queued direction, not current tick direction
      // This makes fast double-presses feel instant — no input lost
      var last = snDirQueue.length ? snDirQueue[snDirQueue.length - 1] : snDir;
      if (d !== OPP[last] && d !== last && snDirQueue.length < 3) snDirQueue.push(d);
    });

    function snakeStart() {
      snake = [{x:12,y:10},{x:11,y:10},{x:10,y:10}];
      snDir = 'R'; snDirQueue = []; snGrowth = 0;
      snScore = 0; snSpeed = 200; snLastTime = -1; snAcc = 0;
      if (elScore) elScore.textContent = 0;
      snUpdateProgress();
      snakePlaceFood();
      if (snRaf) cancelAnimationFrame(snRaf);

      // Countdown 3-2-1 before game starts
      var modal = document.getElementById('sn-modal');
      var title = document.getElementById('sn-title');
      var sub   = document.getElementById('sn-sub');
      var btn   = document.getElementById('sn-btn');
      var big   = document.getElementById('sn-score-big');
      big.style.display = 'none';
      btn.style.display = 'none';
      sub.textContent = '';
      snakeDraw();

      var count = 3;
      title.textContent = count;
      var iv = setInterval(function() {
        count--;
        if (count > 0) {
          title.textContent = count;
        } else {
          clearInterval(iv);
          modal.style.display = 'none';
          btn.style.display = '';
          snRunning = true;
          snRaf = requestAnimationFrame(snakeLoop);
        }
      }, 900);
    }

    function snakePlaceFood() {
      var p;
      do { p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
      while (snake.some(function(s) { return s.x === p.x && s.y === p.y; }));
      // 25% chance of bonus food (+3), 75% normal (+1)
      p.type = Math.random() < 0.25 ? 'bonus' : 'normal';
      snFood = p;
    }

    function snakeLoop(ts) {
      snRaf = requestAnimationFrame(snakeLoop);
      // First frame: just capture timestamp, don't tick yet
      if (snLastTime < 0) { snLastTime = ts; snakeDraw(); return; }
      var dt = Math.min(ts - snLastTime, snSpeed); // cap dt to avoid burst ticks
      snLastTime = ts;
      snAcc += dt;
      if (snAcc >= snSpeed) { snAcc -= snSpeed; snakeTick(); }
      snakeDraw();
    }

    function snakeTick() {
      // Consume next direction from queue
      if (snDirQueue.length) snDir = snDirQueue.shift();
      var h = snake[0], n = {x: h.x, y: h.y};
      if (snDir==='U') n.y--; if (snDir==='D') n.y++;
      if (snDir==='L') n.x--; if (snDir==='R') n.x++;
      n.x = (n.x + COLS) % COLS;
      n.y = (n.y + ROWS) % ROWS;
      if (snake.some(function(s){return s.x===n.x&&s.y===n.y;})) {
        snakeOver(); return;
      }
      snake.unshift(n);
      if (n.x === snFood.x && n.y === snFood.y) {
        var bonus = snFood.type === 'bonus';
        snScore += bonus ? 3 : 1;
        snGrowth += bonus ? 2 : 0; // +1 already given by not popping; +2 extra = +3 total length
        if (elScore) elScore.textContent = snScore;
        snSpeed = Math.max(90, 200 - (snake.length / SN_TOTAL) * 110);
        snUpdateProgress();
        if (snake.length >= SN_TOTAL) { snakeWin(); return; }
        snakePlaceFood();
      } else {
        if (snGrowth > 0) { snGrowth--; } // still growing from bonus food
        else { snake.pop(); }
      }
    }

    function snUpdateProgress() {
      var len = snake ? snake.length : 3;
      var pct = Math.min(100, Math.round(len / SN_TOTAL * 100));
      if (!elFill) return;
      elFill.style.width = pct + '%';
      elPct.textContent = pct + '%  (' + len + ' / ' + SN_TOTAL + ')';
      // Toggle 'full' class only when value actually changes to avoid style recalc
      if (pct >= 100) { elFill.classList.add('full'); }
      else { elFill.classList.remove('full'); }
      // Pulse dot: use CSS animation-name toggle instead of offsetWidth reflow
      elFill.classList.remove('active');
      requestAnimationFrame(function() { elFill.classList.add('active'); });
    }

    function snSaveBest() {
      if (snScore > snBest) {
        snBest = snScore;
        try { localStorage.setItem('snake_best', snBest); } catch(e) {}
        document.getElementById('sn-best').textContent = snBest;
      }
    }

    function snShowModal(title, sub, bigText) {
      snSaveBest();
      var modal = document.getElementById('sn-modal');
      modal.style.display = 'flex';
      document.getElementById('sn-title').textContent = title;
      document.getElementById('sn-sub').textContent = sub;
      var big = document.getElementById('sn-score-big');
      big.textContent = bigText; big.style.display = 'block';
      var btn = document.getElementById('sn-btn');
      btn.textContent = 'Играть снова'; btn.style.display = '';
      document.getElementById('sn-menu-btn').style.display = '';
    }

    function snakeWin() {
      snRunning = false; cancelAnimationFrame(snRaf);
      snShowModal(
        '🏆 100%! Поле заполнено!',
        'Невероятно — ты заполнил всё поле! Легенда! 🌟',
        'Очки: ' + snScore
      );
    }

    function snakeOver() {
      snRunning = false; cancelAnimationFrame(snRaf);
      var len = snake ? snake.length : 3;
      var pct = Math.round(len / SN_TOTAL * 100);
      var msg = pct >= 75 ? 'Почти заполнил! Ещё немного 🔥'
              : pct >= 40 ? 'Больше половины! Неплохо 💪'
              : pct >= 15 ? 'Хороший старт! Попробуй ещё'
              :              'Не расстраивайся, дерзай! 😄';
      snShowModal('💀 Игра окончена', msg, 'Очки: ' + snScore + '  |  ' + pct + '% поля');
    }

    function snakeDraw() {
      if (!snakeCtx) return;
      var ctx = snakeCtx;
      ctx.fillStyle = BG; ctx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
      ctx.strokeStyle = GC; ctx.lineWidth = 1;
      for (var x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,snakeCanvas.height);ctx.stroke();}
      for (var y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(snakeCanvas.width,y*CELL);ctx.stroke();}
      if (!snake) return;
      // Draw all body segments first (no shadow — shadowBlur per segment is very expensive)
      ctx.fillStyle = SK; ctx.shadowBlur = 0;
      for (var i = 1; i < snake.length; i++) {
        ctx.beginPath(); ctx.roundRect(snake[i].x*CELL+2, snake[i].y*CELL+2, CELL-4, CELL-4, CELL*0.38); ctx.fill();
      }
      // Draw head with glow (only one shadow operation total)
      ctx.shadowColor = SH; ctx.shadowBlur = 18; ctx.fillStyle = SH;
      ctx.beginPath(); ctx.roundRect(snake[0].x*CELL+2, snake[0].y*CELL+2, CELL-4, CELL-4, CELL*0.38); ctx.fill();
      ctx.shadowBlur = 0;
      if (snFood.type === 'bonus') {
        // Gold star for bonus food (+3)
        var cx = snFood.x*CELL+CELL/2, cy = snFood.y*CELL+CELL/2, r1 = CELL*0.45, r2 = CELL*0.2;
        ctx.shadowColor = FC_BONUS; ctx.shadowBlur = 22; ctx.fillStyle = FC_BONUS;
        ctx.beginPath();
        for (var sp=0;sp<5;sp++) {
          var ao = sp*Math.PI*2/5 - Math.PI/2;
          var ai = ao + Math.PI/5;
          if(sp===0) ctx.moveTo(cx+r1*Math.cos(ao), cy+r1*Math.sin(ao));
          else ctx.lineTo(cx+r1*Math.cos(ao), cy+r1*Math.sin(ao));
          ctx.lineTo(cx+r2*Math.cos(ai), cy+r2*Math.sin(ai));
        }
        ctx.closePath(); ctx.fill();
        // "+3" label
        ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Inter,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+3', cx, cy);
      } else {
        // Normal red circle for regular food (+1)
        ctx.shadowColor = FC; ctx.shadowBlur = 20; ctx.fillStyle = FC;
        ctx.beginPath(); ctx.arc(snFood.x*CELL+CELL/2, snFood.y*CELL+CELL/2, CELL*0.42, 0, Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur = 0; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      var eyeMap = {R:[[14,6],[14,14]],L:[[4,6],[4,14]],U:[[6,4],[14,4]],D:[[6,14],[14,14]]};
      var eyes = eyeMap[snDir];
      if (eyes && snake.length) {
        var hd = snake[0];
        ctx.fillStyle = '#1a1a2e';
        eyes.forEach(function(o) { ctx.beginPath(); ctx.arc(hd.x*CELL+o[0], hd.y*CELL+o[1], 3, 0, Math.PI*2); ctx.fill(); });
      }
    }
  </script>
</body>
